
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso · Let'sV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>

  <body class="pagina-auth">
    <header class="topo">
      <div class="container topo-conteudo">
        <a href="./index.html" class="logo">Let's<span>V</span></a>
        <a href="./index.html" class="voltar botao-entrar">
          Voltar ao início
        </a>
      </div>
    </header>

    <main class="area-auth">
      <section class="cartao">
        <div class="abas" role="tablist">
          <button
            type="button"
            class="aba ativa"
            role="tab"
            data-alvo="login"
            aria-selected="true"
          >
            Entrar
          </button>

          <button
            type="button"
            class="aba"
            role="tab"
            data-alvo="cadastro"
            aria-selected="false"
          >
            Criar conta
          </button>
        </div>

        <!-- LOGIN -->
        <form id="form-login" novalidate>
          <span class="etiqueta">Bem-vindo de volta</span>

          <h1 class="titulo">
            Pronto para o <span>próximo ponto?</span>
          </h1>

          <div class="campo">
            <label for="login-email">E-mail</label>
            <input
              type="email"
              id="login-email"
              placeholder="arthur@email.com"
              autocomplete="email"
            />
          </div>

          <div class="campo">
            <label for="login-senha">Senha</label>

            <div class="campo-senha">
              <input
                type="password"
                id="login-senha"
                placeholder="Sua senha"
                autocomplete="current-password"
              />

              <button type="button" class="mostrar">Mostrar</button>
            </div>
          </div>

          <p class="mensagem" role="alert"></p>

          <button type="submit" class="botao">
            Entrar em quadra <span>↗</span>
          </button>
        </form>

        <!-- CADASTRO -->
        <form id="form-cadastro" novalidate hidden>
          <span class="etiqueta">Faça parte da equipe</span>

          <h1 class="titulo">
            Entre para o <span>time.</span>
          </h1>

          <div class="grade">
            <div class="campo">
              <label for="cad-nome">Nome</label>

              <input
                type="text"
                id="cad-nome"
                placeholder="Arthur Silva"
                autocomplete="name"
              />
            </div>

            <div class="campo">
              <label for="cad-posicao">Posição em quadra</label>

              <select id="cad-posicao">
                <option value="" selected disabled>Selecione</option>
                <option value="levantador">Levantador</option>
                <option value="ponteiro">Ponteiro</option>
                <option value="central">Central</option>
                <option value="oposto">Oposto</option>
                <option value="libero">Líbero</option>
                <option value="torcedor">Só torcedor</option>
              </select>
            </div>

            <div class="campo largo">
              <label for="cad-email">E-mail</label>

              <input
                type="email"
                id="cad-email"
                placeholder="arthur@email.com"
                autocomplete="email"
              />
            </div>

            <div class="campo">
              <label for="cad-senha">Senha</label>

              <input
                type="password"
                id="cad-senha"
                placeholder="Crie uma senha"
                autocomplete="new-password"
              />
            </div>

            <div class="campo">
              <label for="cad-confirmar">Confirmar senha</label>

              <input
                type="password"
                id="cad-confirmar"
                placeholder="Repita a senha"
                autocomplete="new-password"
              />
            </div>
          </div>

          <ul class="requisitos" id="requisitos">
            <li data-regra="tamanho">8+ caracteres</li>
            <li data-regra="maiuscula">Maiúscula</li>
            <li data-regra="minuscula">Minúscula</li>
            <li data-regra="numero">Número</li>
            <li data-regra="simbolo">Símbolo</li>
          </ul>

          <p class="mensagem" role="alert"></p>

          <button type="submit" class="botao">
            Criar minha conta <span>↗</span>
          </button>
        </form>

        <!-- MENSAGEM DE SUCESSO -->
        <div class="sucesso" id="sucesso" hidden>
          <span class="etiqueta">Tudo certo</span>

          <h2 class="titulo" id="sucesso-titulo"></h2>

          <p id="sucesso-texto"></p>

          <a href="./index.html" class="botao">
            Ir para o início <span>→</span>
          </a>
        </div>
      </section>
    </main>

    <!-- ÚNICO ARQUIVO RESPONSÁVEL PELO LOGIN E CADASTRO -->
    <script src="./js/auth.js" defer></script>
  </body>
</html>
